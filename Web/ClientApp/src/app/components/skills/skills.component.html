<section id="skills">
  <div class="section-container">
    <h2 class="section-title">My <span class="gradient-text">Skills</span></h2>
    <p class="section-subtitle">Technologies I work with</p>

    <div class="space-y-10">
      <div *ngFor="let category of skillCategories">
        <h3 class="text-lg font-semibold text-gray-300 mb-4">{{ category.category }}</h3>
        <div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-6 gap-4">
          <div *ngFor="let skill of category.skills"
               class="glass p-4 text-center hover:border-primary/30 transition-all duration-300 hover:-translate-y-1 group">
            <div class="w-12 h-12 mx-auto mb-3 flex items-center justify-center">
              <img *ngIf="skill.iconUrl" [src]="skill.iconUrl" [alt]="skill.name"
                   class="w-10 h-10 object-contain group-hover:scale-110 transition-transform" />
              <span *ngIf="!skill.iconUrl" class="text-2xl">⚡</span>
            </div>
            <p class="text-sm text-gray-300 font-medium">{{ skill.name }}</p>
            <!-- Proficiency bar -->
            <div class="mt-2 h-1 bg-dark-700 rounded-full overflow-hidden">
              <div class="h-full bg-gradient-to-r from-primary to-secondary rounded-full transition-all duration-1000"
                   [style.width.%]="skill.proficiency"></div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>
